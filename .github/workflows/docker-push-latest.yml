name: Docker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"

            TAGS="cloverdefa/hath:${VERSION}
            cloverdefa/hath:latest"

          elif [[ "${GITHUB_REF_NAME}" == "test" ]]; then
            VERSION="test"

            TAGS="cloverdefa/hath:test"

          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "::error::main branch should be built from a release tag"
            exit 1

          else
            echo "::error::Unexpected ref: ${GITHUB_REF}"
            exit 1
          fi

          echo "IMAGE_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.tags.outputs.IMAGE_VERSION }}
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
