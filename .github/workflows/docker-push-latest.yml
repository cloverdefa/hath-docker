name: Docker

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract IMAGE_VERSION
        id: get_version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^ARG IMAGE_VERSION="?([^"]*)"?$/\1/p' docker/Dockerfile | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::IMAGE_VERSION not found in docker/Dockerfile"
            exit 1
          fi
          echo "IMAGE_VERSION=$VERSION"
          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.IMAGE_VERSION }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="cloverdefa/hath:pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="cloverdefa/hath:${VERSION}
          cloverdefa/hath:latest"
          elif [ "${{ github.ref_name }}" = "rc" ]; then
            TAGS="cloverdefa/hath:${VERSION}-rc
          cloverdefa/hath:rc"
          elif [ "${{ github.ref_name }}" = "test" ]; then
            TAGS="cloverdefa/hath:${VERSION}-test
          cloverdefa/hath:test"
          else
            echo "::error::Unexpected ref_name: ${{ github.ref_name }}"
            exit 1
          fi
          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: github.event_name == 'push'   # PR 事件不登入,避免 fork PR 取得 credentials
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}   # PR 只 build 驗證,merge 後(push 事件)才真正 push
          build-args: |
            IMAGE_VERSION=${{ steps.get_version.outputs.IMAGE_VERSION }}
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
