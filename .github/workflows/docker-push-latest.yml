name: Docker

on:
  push:
    branches:
      - main
      - rc

  pull_request:
    branches:
      - main
      - rc

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract IMAGE_VERSION
        id: get_version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^ARG IMAGE_VERSION="?([^"]*)"?$/\1/p' docker/Dockerfile | head -n1)

          if [ -z "$VERSION" ]; then
            echo "::error::IMAGE_VERSION not found in docker/Dockerfile"
            exit 1
          fi

          echo "IMAGE_VERSION=$VERSION"
          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.IMAGE_VERSION }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="cloverdefa/hath:pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="cloverdefa/hath:${VERSION}
          cloverdefa/hath:latest"
          else
            TAGS="cloverdefa/hath:${VERSION}-rc
          cloverdefa/hath:rc"
          fi

          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            IMAGE_VERSION=${{ steps.get_version.outputs.IMAGE_VERSION }}
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
