name: ci
on:
  push:
    branches:
      - main
      - rc
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract IMAGE_VERSION from Dockerfile
        id: get_version
        run: |
          VERSION=$(grep -m1 '^ARG IMAGE_VERSION=' docker/Dockerfile | sed -E 's/ARG IMAGE_VERSION="?([^"]*)"?/\1/')
          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.get_version.outputs.IMAGE_VERSION }}
          tags: |
            cloverdefa/hath:${{ steps.get_version.outputs.IMAGE_VERSION }}
            cloverdefa/hath:latest
