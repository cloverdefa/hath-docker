name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        github.event.pull_request.head.ref == 'test' ||
        github.event.pull_request.head.ref == 'dev'
      )

    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout main
      # ==============================================================

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # ==============================================================
      # Get next version
      # ==============================================================

      - name: Get next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ----------------------------------------------------------
          # Find latest semantic version tag
          #
          # Example:
          #   v0.1.0
          #   v0.1.1
          #   v1.0.0
          #   v1.2.3
          # ----------------------------------------------------------

          latest_tag=$(
            git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          # ----------------------------------------------------------
          # No existing release
          # ----------------------------------------------------------

          if [ -z "$latest_tag" ]; then
            major=0
            minor=1
            patch=0

            release_type="initial"

          else
            version="${latest_tag#v}"

            IFS='.' read -r major minor patch <<< "$version"

            # --------------------------------------------------------
            # Determine release type from commits since latest release
            #
            # Priority:
            #
            #   MAJOR > MINOR > PATCH
            #
            # MAJOR:
            #   feat!: ...
            #   fix!: ...
            #   refactor!: ...
            #   BREAKING CHANGE: ...
            #
            # MINOR:
            #   feat: ...
            #
            # PATCH:
            #   fix: ...
            #
            # No release:
            #   docs: ...
            #   chore: ...
            #   refactor: ...
            #   test: ...
            #   style: ...
            #   ci: ...
            # --------------------------------------------------------

            release_type="none"

            echo "Latest tag: $latest_tag"
            echo "Analyzing commits since $latest_tag..."

            while IFS= read -r commit; do
              echo "Commit:"
              echo "$commit"

              # ------------------------------------------------------
              # MAJOR
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -Eq '^[a-zA-Z0-9_-]+(\([^)]*\))?!:' ||
                printf '%s\n' "$commit" |
                grep -Eq 'BREAKING CHANGE:'; then

                release_type="major"
                continue
              fi

              # ------------------------------------------------------
              # MINOR
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -Eq '^feat(\([^)]*\))?:'; then

                if [ "$release_type" != "major" ]; then
                  release_type="minor"
                fi

                continue
              fi

              # ------------------------------------------------------
              # PATCH
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -Eq '^fix(\([^)]*\))?:'; then

                if [ "$release_type" = "none" ]; then
                  release_type="patch"
                fi

                continue
              fi

            done < <(
              git log "$latest_tag..HEAD" \
                --pretty=format:'%s%n%b%n---'
            )

            echo "Detected release type: $release_type"

            # --------------------------------------------------------
            # No release required
            # --------------------------------------------------------

            if [ "$release_type" = "none" ]; then
              echo "No release required."

              echo "should_release=false" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            # --------------------------------------------------------
            # Calculate next version
            # --------------------------------------------------------

            case "$release_type" in
              patch)
                patch=$((patch + 1))
                ;;

              minor)
                minor=$((minor + 1))
                patch=0
                ;;

              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;

              *)
                echo "::error::Invalid release type: $release_type"
                exit 1
                ;;
            esac
          fi

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # ----------------------------------------------------------
          # Prevent duplicate tag
          # ----------------------------------------------------------

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "Latest tag: ${latest_tag:-none}"
          echo "Release type: $release_type"
          echo "Next version: $version"
          echo "Next tag: $tag"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Create GitHub Release
      # ==============================================================

      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
