name: Release

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:

  release:
    name: Create GitHub Release & Tag
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          LATEST_VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$LATEST_VERSION" ]]; then
            NEXT_VERSION="v0.1.0"
          else
            VERSION_WITHOUT_V="${LATEST_VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"

            COMMITS=$(git log "${LATEST_VERSION}..HEAD" --oneline || true)

            if echo "$COMMITS" | grep -iE '^(.*: )?(feat|feat\(.*\))|BREAKING CHANGE' > /dev/null; then
              echo "Detected feature or breaking change. Bumping MINOR."
              NEXT_MINOR=$((MINOR + 1))
              NEXT_PATCH=0
              NEXT_VERSION="v${MAJOR}.${NEXT_MINOR}.${NEXT_PATCH}"
            else
              echo "Detected fix or routine changes. Bumping PATCH."
              NEXT_PATCH=$((PATCH + 1))
              NEXT_VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi

          echo "Latest release tag: ${LATEST_VERSION}"
          echo "New release tag to create: ${NEXT_VERSION}"

          echo "VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release and Push Tag
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
