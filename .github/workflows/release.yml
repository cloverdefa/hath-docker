name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------------
      # Checkout main
      # --------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --------------------------------------------------------------
      # Fetch tags
      # --------------------------------------------------------------

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

      # --------------------------------------------------------------
      # Determine and Increment Version
      # --------------------------------------------------------------

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 1. 取得目前最新正式 Tag (例如 v0.4.2)
          LATEST_VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          # 如果完全沒有 Tag，預設從 v0.1.0 開始
          if [[ -z "$LATEST_VERSION" ]]; then
            NEXT_VERSION="v0.1.0"
          else
            VERSION_WITHOUT_V="${LATEST_VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi

          echo "Latest release tag: ${LATEST_VERSION}"
          echo "New release tag to create: ${NEXT_VERSION}"

          echo "VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # Create GitHub Release & Push Tag
      # --------------------------------------------------------------

      - name: Create Release and Push Tag
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
