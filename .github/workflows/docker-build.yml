name: Docker

on:
  # ==============================================================
  # Test build
  #
  # dev → test
  #     ↓
  # push test
  #     ↓
  # Docker
  #
  # Images:
  #   cloverdefa/hath:test
  #   cloverdefa/hath:v0.4.2-test
  # ==============================================================

  push:
    branches:
      - test

  # ==============================================================
  # Release build
  #
  # dev → main
  #     ↓
  # Release
  #     ↓
  # v0.4.2
  #     ↓
  # workflow_run
  #     ↓
  # Docker
  #
  # Images:
  #   cloverdefa/hath:v0.4.2
  #   cloverdefa/hath:latest
  # ==============================================================

  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:
  docker:
    # --------------------------------------------------------------
    # push test:
    #   always build
    #
    # workflow_run:
    #   only build when Release succeeds
    # --------------------------------------------------------------

    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout
      # ==============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==============================================================
      # Determine version and channel
      # ==============================================================

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ==========================================================
          # TEST BUILD
          #
          # Trigger:
          #   push → test
          # ==========================================================

          if [[ "${GITHUB_EVENT_NAME}" == "push" &&
                "${GITHUB_REF_NAME}" == "test" ]]; then

            VERSION=$(
              git tag --list 'v*.*.*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
            )

            if [[ -z "$VERSION" ]]; then
              echo "::error::No release version found."
              exit 1
            fi

            CHANNEL="test"

          # ==========================================================
          # RELEASE BUILD
          #
          # Trigger:
          #   workflow_run → Release
          # ==========================================================

          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then

            VERSION=$(
              git tag --list 'v*.*.*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
            )

            if [[ -z "$VERSION" ]]; then
              echo "::error::No release version found."
              exit 1
            fi

            CHANNEL="release"

          else
            echo "::error::Unexpected event."
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Ref:   ${GITHUB_REF}"
            exit 1
          fi

          echo "========================================"
          echo "Event   : ${GITHUB_EVENT_NAME}"
          echo "Ref     : ${GITHUB_REF}"
          echo "Version : ${VERSION}"
          echo "Channel : ${CHANNEL}"
          echo "========================================"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Determine Docker image tags
      # ==============================================================

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANNEL="${{ steps.version.outputs.CHANNEL }}"

          # ==========================================================
          # TEST
          # ==========================================================

          if [[ "$CHANNEL" == "test" ]]; then

            TAGS="cloverdefa/hath:test"
            TAGS="${TAGS}"$'\n'"cloverdefa/hath:v${VERSION}-test"

          # ==========================================================
          # RELEASE
          # ==========================================================

          elif [[ "$CHANNEL" == "release" ]]; then

            TAGS="cloverdefa/hath:v${VERSION}"
            TAGS="${TAGS}"$'\n'"cloverdefa/hath:latest"

          else
            echo "::error::Unknown channel: ${CHANNEL}"
            exit 1
          fi

          echo "========================================"
          echo "Docker tags:"
          echo "$TAGS"
          echo "========================================"

          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Set up QEMU
      # ==============================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ==============================================================
      # Set up Docker Buildx
      # ==============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==============================================================
      # Login to Docker Hub
      # ==============================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================================================
      # Build and Push
      # ==============================================================

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}

          tags: ${{ steps.tags.outputs.TAGS }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
