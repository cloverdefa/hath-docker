name: Docker

on:
  # ==============================================================
  # Test Docker Build
  #
  # dev → test
  #     ↓
  # push test
  #     ↓
  # Docker
  #
  # Images:
  #   cloverdefa/hath:test
  #   cloverdefa/hath:v0.4.x-test
  # ==============================================================

  push:
    branches:
      - test

  # ==============================================================
  # Release Docker Build
  #
  # dev → main
  #     ↓
  # Release
  #     ↓
  # v0.4.x
  #     ↓
  # workflow_run
  #     ↓
  # Docker
  #
  # Images:
  #   cloverdefa/hath:v0.4.x
  #   cloverdefa/hath:latest
  # ==============================================================

  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:

  # ================================================================
  # TEST
  # ================================================================

  test:
    name: Docker Test Build

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------------
      # Checkout test
      # --------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: test
          fetch-depth: 0

      # --------------------------------------------------------------
      # Fetch tags
      # --------------------------------------------------------------

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

      # --------------------------------------------------------------
      # Determine version
      # --------------------------------------------------------------

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          echo "Latest release version: ${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # Set up QEMU
      # --------------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # --------------------------------------------------------------
      # Set up Buildx
      # --------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------------------
      # Login Docker Hub
      # --------------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------------
      # Build and Push Test Image
      # --------------------------------------------------------------

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}

          tags: |
            cloverdefa/hath:test
            cloverdefa/hath:v${{ steps.version.outputs.VERSION }}-test

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ================================================================
  # RELEASE
  # ================================================================

  release:
    name: Docker Release Build

    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------------
      # Checkout the exact commit from Release workflow
      # --------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # --------------------------------------------------------------
      # Fetch tags
      # --------------------------------------------------------------

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

      # --------------------------------------------------------------
      # Determine released version
      # --------------------------------------------------------------

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          echo "Released version: ${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # Set up QEMU
      # --------------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # --------------------------------------------------------------
      # Set up Buildx
      # --------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------------------
      # Login Docker Hub
      # --------------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------------
      # Build and Push Release Image
      # --------------------------------------------------------------

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}

          tags: |
            cloverdefa/hath:v${{ steps.version.outputs.VERSION }}
            cloverdefa/hath:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max
