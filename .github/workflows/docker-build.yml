name: Docker

on:
  # dev -> test: Release workflow 在 test 分支打好 Tag 後觸發 Docker Test Build
  workflow_run:
    workflows:
      - Release
    types:
      - completed

  # dev -> main: 當 main 分支有更新（包含 test 驗證過的 Tag 與 Commit）時觸發
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ================================================================
  # TEST (test 分支打上 Tag 後執行)
  # ================================================================

  test:
    name: Docker Test Build

    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Release' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 直接讀取 Release workflow 剛建立的最新 Tag (如 v0.4.3 或 v0.5.0)
          VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          echo "Target version: ${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            cloverdefa/hath:test
            cloverdefa/hath:${{ steps.version.outputs.VERSION }}-test


  # ================================================================
  # RELEASE (test 測試完畢合到 main 後執行)
  # ================================================================

  release:
    name: Docker Release Build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

      - name: Determine released version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 讀取從 test 合併過來的既有正式 Tag
          VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          echo "Released version: ${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            cloverdefa/hath:${{ steps.version.outputs.VERSION }}
            cloverdefa/hath:latest
