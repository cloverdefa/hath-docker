name: Docker

on:
  # ==============================================================
  # Test image
  #
  # dev → test
  #
  # Docker:
  #   test
  #   vX.Y.Z-test
  # ==============================================================

  push:
    branches:
      - test

  # ==============================================================
  # Release image
  #
  # test → main
  #     ↓
  # Release workflow
  #     ↓
  # vX.Y.Z
  #     ↓
  # Docker
  #
  # Docker:
  #   vX.Y.Z
  #   latest
  # ==============================================================

  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    # --------------------------------------------------------------
    # Only build:
    #
    # 1. test branch push
    # 2. successful Release workflow
    # --------------------------------------------------------------

    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    steps:
      # ==============================================================
      # Checkout
      # ==============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==============================================================
      # Determine version
      # ==============================================================

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ==========================================================
          # Test branch
          # ==========================================================

          if [[ "${GITHUB_EVENT_NAME}" == "push" &&
                "${GITHUB_REF_TYPE}" == "branch" &&
                "${GITHUB_REF_NAME}" == "test" ]]; then

            VERSION=$(
              git tag --list 'v*.*.*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sed 's/^v//' |
              sort -V |
              tail -n 1 || true
            )

            if [[ -z "$VERSION" ]]; then
              echo "::error::No release version found"
              exit 1
            fi

            CHANNEL="test"

          # ==========================================================
          # Release workflow
          # ==========================================================

          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then

            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "::error::Release workflow did not succeed"
              exit 1
            fi

            # --------------------------------------------------------
            # Get the release tag created by Release workflow.
            #
            # workflow_run does not automatically checkout that ref,
            # therefore fetch tags and determine the latest release.
            # --------------------------------------------------------

            VERSION=$(
              git tag --list 'v*.*.*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
            )

            if [[ -z "$VERSION" ]]; then
              echo "::error::No release version found after Release workflow"
              exit 1
            fi

            CHANNEL="release"

          else
            echo "::error::Unexpected event: ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          echo "========================================"
          echo "Event   : ${GITHUB_EVENT_NAME}"
          echo "Ref     : ${GITHUB_REF}"
          echo "Version : ${VERSION}"
          echo "Channel : ${CHANNEL}"
          echo "========================================"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Determine image tags
      # ==============================================================

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANNEL="${{ steps.version.outputs.CHANNEL }}"

          if [[ "$CHANNEL" == "release" ]]; then

            TAGS="cloverdefa/hath:v${VERSION}"
            TAGS="${TAGS}"$'\n'"cloverdefa/hath:latest"

          elif [[ "$CHANNEL" == "test" ]]; then

            TAGS="cloverdefa/hath:v${VERSION}-test"
            TAGS="${TAGS}"$'\n'"cloverdefa/hath:test"

          else
            echo "::error::Unknown channel: $CHANNEL"
            exit 1
          fi

          echo "Docker image tags:"
          echo "$TAGS"

          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Set up QEMU
      # ==============================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ==============================================================
      # Set up Docker Buildx
      # ==============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==============================================================
      # Login to Docker Hub
      # ==============================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================================================
      # Build and push
      # ==============================================================

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}

          tags: ${{ steps.tags.outputs.TAGS }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
