name: Docker

on:
  push:
    branches:
      - test

  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:

  # ================================================================
  # TEST (PR/Push 到 test 時執行：預測下一個 Patch 版號，推送 v0.4.3-test)
  # ================================================================

  test:
    name: Docker Test Build

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: test
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          LATEST_VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$LATEST_VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          VERSION_WITHOUT_V="${LATEST_VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"

          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "Latest release version: ${LATEST_VERSION}"
          echo "Next test version: ${NEXT_VERSION}"

          echo "VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            cloverdefa/hath:test
            cloverdefa/hath:${{ steps.version.outputs.VERSION }}-test


  # ================================================================
  # RELEASE (Release workflow 完成後觸發：直接抓取剛剛建立的正式 Tag v0.4.3)
  # ================================================================

  release:
    name: Docker Release Build

    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Release' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

      - name: Determine released version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 直接讀取最新剛建立的 Tag (此時已經是 v0.4.3)
          VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          echo "Released version: ${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            cloverdefa/hath:${{ steps.version.outputs.VERSION }}
            cloverdefa/hath:latest
