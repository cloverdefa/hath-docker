name: Docker

on:
  push:
    branches:
      - test
      - main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout
      # ==============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==============================================================
      # Get latest release version
      # ==============================================================

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" == "test" ]]; then
            CHANNEL="test"

          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            CHANNEL="release"

          else
            echo "::error::Unexpected branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "========================================"
          echo "Branch  : ${GITHUB_REF_NAME}"
          echo "Version : ${VERSION}"
          echo "Channel : ${CHANNEL}"
          echo "========================================"

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Determine Docker image tags
      # ==============================================================

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANNEL="${{ steps.version.outputs.CHANNEL }}"

          if [[ "$CHANNEL" == "test" ]]; then

            TAGS="cloverdefa/hath:test"
            TAGS="${TAGS}"$'\n'"cloverdefa/hath:v${VERSION}-test"

          elif [[ "$CHANNEL" == "release" ]]; then

            TAGS="cloverdefa/hath:v${VERSION}"
            TAGS="${TAGS}"$'\n'"cloverdefa/hath:latest"

          else
            echo "::error::Unknown channel: ${CHANNEL}"
            exit 1
          fi

          echo "Docker image tags:"
          echo "$TAGS"

          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ==============================================================
      # QEMU
      # ==============================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ==============================================================
      # Buildx
      # ==============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ==============================================================
      # Docker Hub Login
      # ==============================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================================================
      # Build and Push
      # ==============================================================

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}

          tags: ${{ steps.tags.outputs.TAGS }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
