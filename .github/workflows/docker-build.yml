name: Docker

on:
  push:
    branches:
      - test
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:

  # ================================================================
  # 1. TEST (dev -> test): 預測版號，構建 v0.4.4-test 與 test
  # ================================================================

  test:
    name: Docker Test Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: test
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

      - name: Predict test version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          LATEST_VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$LATEST_VERSION" ]]; then
            NEXT_VERSION="v0.1.0"
          else
            VERSION_WITHOUT_V="${LATEST_VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"

            COMMITS=$(git log "${LATEST_VERSION}..HEAD" --oneline || true)

            if echo "$COMMITS" | grep -iE '^(.*: )?(feat|feat\(.*\))|BREAKING CHANGE' > /dev/null; then
              NEXT_MINOR=$((MINOR + 1))
              NEXT_VERSION="v${MAJOR}.${NEXT_MINOR}.0"
            else
              NEXT_PATCH=$((PATCH + 1))
              NEXT_VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi

          echo "VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            cloverdefa/hath:test
            cloverdefa/hath:${{ steps.version.outputs.VERSION }}-test


  # ================================================================
  # 2. RELEASE (dev -> main): 抓取已發布的 Tag，構建 v0.4.4 與 latest
  # ================================================================

  release:
    name: Docker Release Build
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

      - name: Get released tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$VERSION" ]]; then
            echo "::error::No release version found."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            cloverdefa/hath:${{ steps.version.outputs.VERSION }}
            cloverdefa/hath:latest
