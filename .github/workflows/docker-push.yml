name: Docker
on:
  # ==============================================================
  # Test image
  #
  # dev → test
  #
  # Docker:
  #   test
  #   vX.Y.Z-test
  # ==============================================================
  push:
    branches:
      - test
  # ==============================================================
  # Release image
  #
  # test → main
  #     ↓
  # Release workflow
  #     ↓
  # GitHub Release vX.Y.Z
  #     ↓
  # Docker
  #
  # Docker:
  #   vX.Y.Z
  #   latest
  # ==============================================================
  release:
    types:
      - published
  # ==============================================================
  # Manual build
  #
  # Used for recovering a missed Docker build.
  # ==============================================================
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.3.1"
        required: true
        type: string
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # ==============================================================
      # Checkout
      # ==============================================================
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ==============================================================
      # Determine version
      # ==============================================================
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          # ==========================================================
          # Test branch
          # ==========================================================
          if [[ "${GITHUB_EVENT_NAME}" == "push" &&
                "${GITHUB_REF_TYPE}" == "branch" &&
                "${GITHUB_REF_NAME}" == "test" ]]; then
            LATEST_TAG=$(
              git tag --list 'v*.*.*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
            )
            if [[ -z "$LATEST_TAG" ]]; then
              echo "::error::No release version found."
              exit 1
            fi
            VERSION="${LATEST_TAG#v}"
            CHANNEL="test"
          # ==========================================================
          # GitHub Release
          # ==========================================================
          elif [[ "${GITHUB_EVENT_NAME}" == "release" &&
                  "${GITHUB_EVENT_ACTION}" == "published" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag: $TAG"
              exit 1
            fi
            VERSION="${TAG#v}"
            CHANNEL="release"
          # ==========================================================
          # Manual workflow
          # ==========================================================
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version: $VERSION"
              echo "::error::Expected format: X.Y.Z"
              exit 1
            fi
            CHANNEL="release"
          else
            echo "::error::Unexpected event."
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Ref:   ${GITHUB_REF}"
            exit 1
          fi
          echo "========================================"
          echo "Event   : ${GITHUB_EVENT_NAME}"
          echo "Ref     : ${GITHUB_REF}"
          echo "Version : ${VERSION}"
          echo "Channel : ${CHANNEL}"
          echo "========================================"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_OUTPUT"
      # ==============================================================
      # Determine Docker image tags
      # ==============================================================
      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANNEL="${{ steps.version.outputs.CHANNEL }}"
          case "$CHANNEL" in
            # --------------------------------------------------------
            # Test
            #
            # v0.3.1
            #
            # =>
            #
            # test
            # v0.3.1-test
            # --------------------------------------------------------
            test)
              TAGS="cloverdefa/hath:test"
              TAGS="${TAGS}"$'\n'"cloverdefa/hath:v${VERSION}-test"
              ;;
            # --------------------------------------------------------
            # Release
            #
            # v0.3.1
            #
            # =>
            #
            # v0.3.1
            # latest
            # --------------------------------------------------------
            release)
              TAGS="cloverdefa/hath:v${VERSION}"
              TAGS="${TAGS}"$'\n'"cloverdefa/hath:latest"
              ;;
            *)
              echo "::error::Unknown channel: ${CHANNEL}"
              exit 1
              ;;
          esac
          echo "Docker image tags:"
          echo "$TAGS"
          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # ==============================================================
      # Set up QEMU
      # ==============================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # ==============================================================
      # Set up Docker Buildx
      # ==============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # ==============================================================
      # Login to Docker Hub
      # ==============================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # ==============================================================
      # Build and push
      # ==============================================================
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max