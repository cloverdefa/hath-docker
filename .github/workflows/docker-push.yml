name: Docker

on:
  push:
    branches:
      - test

    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          git fetch --tags

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL="release"

          elif [[ "${GITHUB_REF_NAME}" == "test" ]]; then
            VERSION=$(
              git tag --list 'v[0-9]*.[0-9]*.[0-9]*' |
              sort -V |
              tail -n 1 |
              sed 's/^v//'
            )

            if [ -z "$VERSION" ]; then
              echo "::error::No release version found"
              exit 1
            fi

            CHANNEL="test"

          else
            echo "::error::Unexpected ref: ${GITHUB_REF}"
            exit 1
          fi

          echo "VERSION=$VERSION"
          echo "CHANNEL=$CHANNEL"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANNEL="${{ steps.version.outputs.CHANNEL }}"

          if [[ "$CHANNEL" == "release" ]]; then
            TAGS="cloverdefa/hath:${VERSION}
cloverdefa/hath:latest"

          elif [[ "$CHANNEL" == "test" ]]; then
            TAGS="cloverdefa/hath:test-${VERSION}
cloverdefa/hath:test"

          else
            echo "::error::Unknown channel: $CHANNEL"
            exit 1
          fi

          {
            echo "TAGS<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
