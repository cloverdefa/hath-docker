---
name: hath-service
services:
  hath:
    container_name: "hath"
    image: "cloverdefa/hath:latest"
    restart: "unless-stopped"
    networks:
      - "hath-networks"
    ports:
      - "12345:12345" # 修改HATH設定PORT
    user: "1000:1000" # id -u 查詢 uid 以及 id -g 查詢 gid
    volumes:
      - "./cache:/hath/cache"
      - "./data:/hath/data"
      - "./download:/hath/download"
      - "./log:/hath/log"
      - "./tmp:/hath/tmp"
    environment:
      UMASK: "077"
      TZ: "Asia/Taipei" # 設定主機所在時區
    env_file:
      - "./.env"

networks:
  hath-networks:
    name: "hath-networks"
